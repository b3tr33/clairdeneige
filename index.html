<style>
:root{
  --night:#121829; --night2:#1a2138; --snow:#f6f3ee; --ink:#e9e5ee; --mute:#9a98ab;
  --peach:#efb9a3; --peach2:#d98f78; --line:rgba(255,255,255,.08);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{font-family:var(--sans);color:var(--ink);background:var(--night);min-height:100vh;padding-bottom:calc(92px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* hero */
.hero{position:relative;max-width:720px;margin:0 auto}
.hero img{width:100%;aspect-ratio:1/1;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,24,41,.75) 0%,rgba(18,24,41,.1) 32%,rgba(18,24,41,0) 55%,rgba(18,24,41,.55) 82%,var(--night) 100%)}
.hero-t{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7%);left:0;right:0;text-align:center;z-index:1;padding:0 20px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,9vw,56px);line-height:1.02;color:#fbf8f2;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.rule{width:56px;height:1px;background:var(--peach);margin:16px auto}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:clamp(17px,4.6vw,21px);color:#f5ede6}
.hero .date{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--peach);margin-top:10px}

.actions{max-width:720px;margin:-8px auto 0;padding:0 20px;position:relative;z-index:2;display:flex;gap:10px;align-items:center}
.btn-play{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;background:var(--peach);color:#1a1420;font-weight:500;font-size:16px;box-shadow:0 8px 24px rgba(239,185,163,.25)}
.btn-play svg{width:18px;height:18px}
.btn-ghost{height:54px;padding:0 18px;border-radius:27px;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:8px;font-size:14px;text-decoration:none;color:var(--ink)}
.meta{max-width:720px;margin:14px auto 0;padding:0 20px;font-size:13px;color:var(--mute)}

/* list */
.list{max-width:720px;margin:22px auto 0;padding:0 8px}
.row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;width:100%;text-align:left}
.row:active{background:var(--night2)}
.row.on{background:var(--night2)}
.row .th{width:48px;height:64px;border-radius:8px;overflow:hidden;flex:none;position:relative}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .tt{font-family:var(--serif);font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.mv .tt{font-style:italic}
.row .ts{font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .tt{color:var(--peach)}
.row .d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .more{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}
.row .more svg{width:20px;height:20px}
.eq{position:absolute;inset:0;background:rgba(18,24,41,.55);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:22px}
.row.on .eq{display:flex}
.eq i{width:3px;background:var(--peach);border-radius:2px;height:8px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}

.foot{max-width:720px;margin:40px auto 0;padding:0 24px 30px;text-align:center;color:var(--mute);font-size:12px;line-height:1.7}
.foot em{font-family:var(--serif);font-size:17px;color:var(--ink)}

/* mini player */
.mini{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));z-index:20;background:rgba(30,37,60,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;transform:translateY(140%);transition:transform .35s ease;max-width:720px;margin:0 auto}
.mini.show{transform:none}
.mini .bar{height:3px;background:rgba(255,255,255,.1)}
.mini .bar i{display:block;height:100%;width:0;background:var(--peach)}
.mini .in{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px}
.mini .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mini img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.mini .mt{font-family:var(--serif);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:11px;color:var(--mute)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib svg{width:24px;height:24px}

/* full player */
.full{position:fixed;inset:0;z-index:30;background:var(--night);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.full.show{transform:none}
.fbg{position:relative;height:min(62vh,640px)}
.fbg img{width:100%;height:100%;object-fit:cover}
.fbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,24,41,.55) 0%,rgba(18,24,41,0) 22%,rgba(18,24,41,0) 60%,var(--night) 100%)}
.fclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center}
.fshare{left:auto;right:10px}
.fclose svg{width:22px;height:22px}
.fbody{max-width:620px;margin:-40px auto 0;position:relative;z-index:1;padding:0 24px calc(40px + var(--safe-b))}
.fnum{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--peach)}
.ftitle{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.08;margin-top:6px}
.fsub{font-family:var(--serif);font-style:italic;color:var(--mute);font-size:18px;margin-top:4px}
.seek{margin-top:22px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--peach) var(--p,0%),rgba(255,255,255,.15) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--peach)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:14px}
.ctrl .ib svg{width:30px;height:30px}
.big{width:72px;height:72px;border-radius:50%;background:var(--peach);color:#1a1420;display:grid;place-items:center}
.big svg{width:30px;height:30px}
.opts{display:flex;justify-content:center;margin-top:18px}
.chip{font-size:12px;padding:8px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);color:var(--mute)}
.chip.on{border-color:var(--peach);color:var(--peach)}
.lyr{margin-top:34px;font-family:var(--serif);font-size:18px;line-height:1.55;color:#ece8f0}
.lyr p{margin-bottom:20px}
.lyr .it{font-style:italic;color:#b9a8b4}
.lyr .lab{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--peach);margin-bottom:14px}
.instr{margin-top:34px;font-family:var(--serif);font-style:italic;font-size:20px;color:#cfc9d8;text-align:center}
.hidden{display:none!important}
@media(min-width:760px){ .hero img{aspect-ratio:16/10} }
</style>
</head>

const $ = id => document.getElementById(id);
const audio = $('audio');
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const MORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';
let idx = -1, singleMode = false;

const fmt = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const label = t => t.kind === 'mvt' ? 'Suite · ' + t.sub : t.sub;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// list
$('list').innerHTML = T.map((t,i) => `
  <div class="row${t.kind==='mvt'?' mv':''}" data-i="${i}" role="button" tabindex="0">
    <div class="th"><img src="${t.sq}" alt="" loading="lazy"><div class="eq"><i></i><i></i><i></i></div></div>
    <div class="tx"><div class="tt">${esc(t.title)}</div><div class="ts">${String(t.n).padStart(2,'0')} · ${esc(label(t))}</div></div>
    <div class="d">${fmt(t.dur)}</div>
    <button class="more" data-info="${i}" aria-label="Details">${MORE}</button>
  </div>`).join('');

$('list').addEventListener('click', e => {
  const info = e.target.closest('[data-info]');
  if (info) { e.stopPropagation(); const i = +info.dataset.info; if (i !== idx) load(i, false); openFull(); return; }
  const row = e.target.closest('.row'); if (!row) return;
  const i = +row.dataset.i;
  if (i === idx) toggle(); else { singleMode = false; load(i, true); }
});

function load(i, play) {
  idx = (i + T.length) % T.length;
  const t = T[idx];
  audio.src = t.src;
  document.querySelectorAll('.row').forEach((r,k) => r.classList.toggle('on', k === idx));
  $('miniImg').src = t.sq; $('miniTitle').textContent = t.title; $('miniSub').textContent = label(t);
  $('fImg').src = t.img; $('fNum').textContent = 'Titel ' + String(t.n).padStart(2,'0') + ' / 15';
  $('fTitle').textContent = t.title;
  $('fSub').textContent = t.kind === 'mvt' ? 'Le Jardin au Clair de Neige · Suite' : t.sub;
  $('dur').textContent = fmt(t.dur); $('cur').textContent = '0:00'; setSeek(0);
  $('fText').innerHTML = t.lyrics
    ? '<div class="lyr"><div class="lab">' + (t.sub === 'Français' ? 'Paroles' : 'Lyrics') + '</div>' +
      t.lyrics.map(st => '<p>' + st.map(l => (/^\(|\.\.\.$|^Première neige\.|^First snow\./.test(l) ? '<span class="it">' + esc(l) + '</span>' : esc(l))).join('<br>') + '</p>').join('') + '</div>'
    : '<p class="instr">' + esc(t.sub) + '</p>';
  $('mini').classList.add('show');
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.full, artist: 'Markus', album: 'Le Jardin au Clair de Neige',
      artwork: [{src: new URL(t.sq, location.href).href, sizes: '512x512', type: 'image/jpeg'}]
    });
  }
  history.replaceState(null, '', '#' + t.n);
  if (play) audio.play().catch(()=>{});
  updateIcons();
}

function toggle() { if (idx < 0) { load(0, true); return; } audio.paused ? audio.play() : audio.pause(); }
function updateIcons() {
  const p = audio.paused;
  $('miniPlay').innerHTML = p ? PLAY : PAUSE; $('fPlay').innerHTML = p ? PLAY : PAUSE;
  document.body.classList.toggle('paused', p);
  $('playAllLabel').textContent = idx < 0 ? 'Album abspielen' : (p ? 'Weiterhören' : 'Pause');
  $('single').classList.toggle('on', singleMode);
}
function setSeek(f) { const s = $('seek'); s.value = Math.round(f*1000); s.style.setProperty('--p', (f*100) + '%'); $('miniBar').style.width = (f*100) + '%'; }

$('playAll').onclick = () => { if (idx < 0) { singleMode = false; load(0, true); } else toggle(); };
$('miniPlay').onclick = toggle; $('fPlay').onclick = toggle;
$('miniNext').onclick = () => load(idx + 1, true);
$('next').onclick = () => load(idx + 1, true);
$('prev').onclick = () => { if (audio.currentTime > 4) audio.currentTime = 0; else load(idx - 1, true); };
$('single').onclick = () => { singleMode = !singleMode; updateIcons(); };

audio.addEventListener('play', updateIcons);
audio.addEventListener('pause', updateIcons);
audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); });
let dragging = false;
audio.addEventListener('timeupdate', () => {
  if (dragging || !audio.duration) return;
  $('cur').textContent = fmt(audio.currentTime); setSeek(audio.currentTime / audio.duration);
});
audio.addEventListener('ended', () => {
  if (singleMode) { audio.currentTime = 0; updateIcons(); return; }
  if (idx < T.length - 1) load(idx + 1, true); else { updateIcons(); }
});
const seek = $('seek');
seek.addEventListener('input', () => { dragging = true; const f = seek.value/1000; setSeek(f); $('cur').textContent = fmt(f*(audio.duration||T[idx].dur)); });
seek.addEventListener('change', () => { if (audio.duration) audio.currentTime = seek.value/1000*audio.duration; dragging = false; });

function openFull() { $('full').classList.add('show'); $('full').setAttribute('aria-hidden','false'); $('full').scrollTop = 0; }
function closeFull() { $('full').classList.remove('show'); $('full').setAttribute('aria-hidden','true'); }
$('openFull').onclick = openFull; $('closeFull').onclick = closeFull;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFull(); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); toggle(); } });

// swipe down to close
let y0 = null;
$('full').addEventListener('touchstart', e => { y0 = $('full').scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
$('full').addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeFull(); y0 = null; }, {passive:true});

$('share').onclick = async () => {
  const t = T[idx]; const url = location.href.split('#')[0] + '#' + t.n;
  try { if (navigator.share) await navigator.share({title: t.full + ' – Le Jardin au Clair de Neige', url}); else { await navigator.clipboard.writeText(url); alert('Link kopiert'); } } catch(e){}
};

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').onclick());
  navigator.mediaSession.setActionHandler('nexttrack', () => load(idx + 1, true));
  try { navigator.mediaSession.setActionHandler('seekto', d => { audio.currentTime = d.seekTime; }); } catch(e){}
}

// deep link: #3 opens track 3 (single song)
const h = parseInt(location.hash.slice(1), 10);
if (h >= 1 && h <= T.length) { load(h - 1, false); singleMode = true; updateIcons(); openFull(); }
updateIcons();
</script>
</body>
